[project]
name = "ebios-rm-agent"
version = "0.1.0"
description = "AI-assisted agent for the EBIOS Risk Manager methodology"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# asyncio_mode = "auto"  # re-enable when Workshop 4 (async fan-out) adds async tests

[tool.setuptools.packages.find]
where = ["src"]
