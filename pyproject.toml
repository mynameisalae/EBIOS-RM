[project]
name = "ebios-rm-agent"
version = "0.1.0"
description = "AI-assisted agent for the EBIOS Risk Manager methodology"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"  # needed by the Orchestrator's run_mission() (async WorkshopRunner.run/resume)

[tool.setuptools.packages.find]
where = ["src"]
