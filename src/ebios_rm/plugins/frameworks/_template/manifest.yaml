# The id declared here is authoritative everywhere: it overrides whatever the rows
# of controls.json carry, and it is what an auditor's free-text mention is matched
# against. The folder name is not used for anything (nist_csf declares NIST), so
# pick the id an auditor would write, not a directory name.
# Match is on the id's word set, so « NIST CSF 2.0 » reaches NIST and « Norme ISO
# 27001 » reaches ISO27001. Keep it specific enough not to collide with a sibling
# standard you may add later.
id: CHANGE_ME                 # e.g. HIPAA, PCI_DSS
name: "Full display name"
framework_version: "CHANGE_ME"  # e.g. '2022', 'CSF 2.0', '2016/679'
legal_nature: >
  Free text — licensing/publication status of this referential (commercial
  license, public domain, free reuse, ...), conception §12.2.
has_legal_impact_provisions: false   # true if any control row sets legal_impact_type, §12.3
default_suggested: false             # true only for the four defaults, §12.4
